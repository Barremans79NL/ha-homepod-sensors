name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # editable_mode=compat keeps a real directory on sys.path instead of the
        # PEP 660 import hook, which Home Assistant's integration loader chokes on
        # (FileNotFoundError on __editable__.*.finder.__path_hook__).
        run: pip install -e ".[dev]" --config-settings editable_mode=compat

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v
